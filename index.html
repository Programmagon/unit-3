<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#171c29" />
  <!-- Theme VOR dem ersten Zeichnen setzen (kein Aufblitzen). Gleiche Logik wie src/lib/theme.ts. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('u3.theme');
        var t = (p === 'light' || p === 'dark') ? p : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <title>Unit 3</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
